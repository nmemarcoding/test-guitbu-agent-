name: Test Claude Code Cloud

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test-claude:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Create a file named CLAUDE-CLOUD-TEST.md
            in the repository root.

            Write exactly:
            Claude successfully created this file in GitHub Cloud.

            Verify that the file exists after writing it.
            Do not modify any other files.
          claude_args: |
            --max-turns 5
            --allowedTools "Read,Write"

      - name: Check generated file
        run: |
          echo "Checking Claude output..."
          ls -la
          if [ -f CLAUDE-CLOUD-TEST.md ]; then
            echo "SUCCESS: File exists."
            cat CLAUDE-CLOUD-TEST.md
          else
            echo "ERROR: Claude did not create the file."
            exit 1
          fi
